name: Build Windows executable

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify Python sources compile
        run: python -m py_compile keypoint_labeler.py utils.py

      - name: Build Windows executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name keypoint_labeler
          --collect-all skimage
          --collect-all shapely
          --collect-all matplotlib
          keypoint_labeler.py

      - name: Stage artifact contents
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-dist | Out-Null
          Copy-Item dist/keypoint_labeler.exe windows-dist/
          if (Test-Path full_annotations.geojson) {
            Copy-Item full_annotations.geojson windows-dist/
          }
          @"
          keypoint_labeler.exe was built by GitHub Actions.

          If full_annotations.geojson is not included in this artifact,
          place it next to the executable before running the app.

          The app writes keypoint_labels.json next to the executable.
          "@ | Set-Content windows-dist/README.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: keypoint_labeler-windows
          path: windows-dist
